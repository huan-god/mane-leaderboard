<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161210" />
  <meta name="description" content="重返未来：1999 玩家社区榜单——融合「鬃毛邮报」调查积分榜与「焦点闪回」最短回合纪录，完整兼容社区投稿与审核体系。" />
  <title>重返未来：1999 · 鬃毛邮报 &amp; 焦点闪回 玩家榜单</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231b1411' stroke='%23df6931' stroke-width='3'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='32' font-family='serif' fill='%23ede4d7'%3E%E9%82%AE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css?v=20261125-opt1" />
  <link rel="stylesheet" href="./submission-progress.css?v=20261125-opt1" />
  <script src="./config.js"></script>
  <script type="module" src="./app.js?v=20261125-opt1"></script>
</head>
<body data-mode="mane">
  <!-- 实机老报纸网点与纸纤维暗角底纹（参考 game-mane-survey.png / game-mane-atlantis.png） -->
  <div class="arch-backdrop" aria-hidden="true"></div>
  <div class="halftone-layer" aria-hidden="true"></div>
  <div class="paper-grain" aria-hidden="true"></div>

  <header class="topbar" id="top">
    <div class="topbar-inner">
      <a class="brand" href="#mane/scores" data-switch-mode="mane" aria-label="返回榜单首页">
        <span class="brand-seal" aria-hidden="true">
          <span class="seal-ring"></span>
          <span class="seal-glyph" id="brandGlyph">邮</span>
        </span>
        <span class="brand-copy">
          <strong id="brandTitle">鬃毛邮报 · 调查总榜</strong>
          <small>REVERSE: 1999 · COMMUNITY ARCHIVE</small>
        </span>
      </a>

      <!-- 官方细铜框双模式切换（保留 ▷▶○× 装饰角标） -->
      <div class="mode-switcher" role="tablist" aria-label="榜单模式切换">
        <span class="frame-glyphs left" aria-hidden="true">▷▶○×</span>
        <button class="mode-tab active" role="tab" aria-selected="true" data-mode-switch="mane">
          <span class="mode-cn">鬃毛邮报</span>
          <span class="mode-en">MANE’S BULLETIN</span>
        </button>
        <button class="mode-tab" role="tab" aria-selected="false" data-mode-switch="flashback">
          <span class="mode-cn">焦点闪回</span>
          <span class="mode-en">FLASHBACK</span>
        </button>
        <span class="frame-glyphs right" aria-hidden="true">1999</span>
      </div>

      <div class="top-actions">
        <span id="connectionBadge" class="status-pill" aria-live="polite">
          <span class="status-dot"></span>
          <span id="connectionText">连接档案库…</span>
        </span>
        <button id="adminCenterBtn" class="ghost-btn" hidden><span class="acc-full">管理后台</span><span class="acc-short">后台</span></button>
        <button type="button" class="ghost-btn" data-action="my-submissions"><span class="acc-full">我的投稿</span><span class="acc-short">进度</span></button>
        <button id="accountBtn" class="ghost-btn"><span class="acc-full">管理员登录</span><span class="acc-short">登录</span></button>
        <button id="submitBtn" class="action-cta-btn" disabled>
          <span class="cta-main">＋ 投稿<span class="cta-ext">成绩</span></span>
          <span class="cta-sub" aria-hidden="true">SUBMIT ▽▽</span>
        </button>
      </div>
    </div>

    <!-- 次级导航条 -->
    <nav class="subnav-bar" aria-label="榜单视图导航">
      <div class="subnav-inner" id="subnav"></div>
    </nav>
  </header>

  <main class="shell">
    <!-- 紧凑报头 Masthead（整合版本期次与全站统计，桌面首屏直达前三名） -->
    <section class="masthead" id="masthead" aria-live="polite"></section>

    <!-- 全局提示栏（仅在离线/报错时显示） -->
    <div id="globalNotice" class="global-notice" role="status" hidden></div>

    <!-- 核心榜单工作区 -->
    <div id="workspace" class="workspace"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-col">
        <div class="footer-brand">
          <strong>REVERSE: 1999 · 玩家社区榜单</strong>
          <span>鬃毛邮报调查积分榜 × 焦点闪回最短回合榜</span>
        </div>
        <p class="footer-credits">
          社区榜单站长：幻化凌风（<a href="https://space.bilibili.com/266889606" target="_blank" rel="noopener noreferrer">哔哩哔哩主页 ↗</a>）·
          管理员：寻屿、莳雨枫椛、偶尔出现的神秘猫猫头、椋-喵
        </p>
      </div>
      <div class="footer-col footer-links">
        <div class="footer-ref-links">
          <a href="https://res1999.huijiwiki.com/wiki/%E9%AC%83%E6%AF%9B%E9%82%AE%E6%8A%A5" target="_blank" rel="noopener noreferrer">灰机 Wiki · 鬃毛邮报 ↗</a>
          <a href="https://res1999.huijiwiki.com/wiki/%E7%84%A6%E7%82%B9%E9%97%AA%E5%9B%9E" target="_blank" rel="noopener noreferrer">灰机 Wiki · 焦点闪回 ↗</a>
        </div>
        <p class="footer-disclaimer">
          本网站为非官方玩家共建社区项目，与游戏发行方无隶属关系。请勿在成绩截图中暴露个人敏感信息。
        </p>
      </div>
    </div>
  </footer>

  <div id="modalRoot"></div>
  <div id="charPickerRoot"></div>
  <div id="psyPickerRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
