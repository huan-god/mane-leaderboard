  <title>重返未来：1999 · 鬃毛邮报 &amp; 焦点闪回 玩家榜单</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231b1411' stroke='%23df6931' stroke-width='3'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='32' font-family='serif' fill='%23ede4d7'%3E%E9%82%AE%3C/text%3E%3C/svg%3E" />

  <link rel="stylesheet" href="./submission-progress.css?v=20261127-v6" />
  <script src="./config.js?v=20261127-v6"></script>
  <script defer src="./app.bundle.js?v=20261127-v6"></script>
</head>
<body data-mode="mane" data-lang="zh">
  <div class="arch-backdrop" aria-hidden="true"></div>
  <div class="halftone-layer" aria-hidden="true"></div>
  <div class="paper-grain" aria-hidden="true"></div>

  <header class="topbar" id="top">
    <div class="topbar-inner">
      <a class="brand" id="brandHomeLink" href="#mane/scores" data-switch-mode="mane" aria-label="返回榜单首页">
        <span class="brand-seal" aria-hidden="true">
          <span class="seal-ring"></span>
          <span class="seal-glyph" id="brandGlyph">邮</span>
        </span>
        <span class="brand-copy">
          <strong id="brandTitle">鬃毛邮报 · 调查总榜</strong>
          <small id="brandSub">REVERSE: 1999 · COMMUNITY ARCHIVE</small>
        </span>
      </a>

      <div class="mode-switcher" id="modeSwitcher" role="tablist" aria-label="榜单模式切换">
        <span class="frame-glyphs left" aria-hidden="true">▷▶○×</span>
        <button type="button" class="mode-tab active" role="tab" aria-selected="true" data-mode-switch="mane">
          <span class="mode-cn" id="modeManeLabel">鬃毛邮报</span>
          <span class="mode-en">MANE’S BULLETIN</span>
        </button>
        <button type="button" class="mode-tab" role="tab" aria-selected="false" data-mode-switch="flashback">
          <span class="mode-cn" id="modeFbLabel">焦点闪回</span>
          <span class="mode-en">FLASHBACK</span>
        </button>
        <span class="frame-glyphs right" aria-hidden="true">1999</span>
      </div>

      <div class="top-actions">
        <div class="lang-switch" role="group" aria-label="切换中英文界面">
          <button type="button" class="lang-btn" data-set-lang="en" aria-pressed="false">EN</button>
          <button type="button" class="lang-btn active" data-set-lang="zh" aria-pressed="true">中文</button>
        </div>
        <button type="button" id="adminCenterBtn" class="ghost-btn" hidden>
          <span class="acc-full">管理后台</span><span class="acc-short">后台</span>
        </button>
        <button type="button" id="mySubmissionsBtn" class="ghost-btn" data-action="my-submissions">
          <span class="acc-full">我的投稿</span><span class="acc-short">进度</span>
        </button>
        <button type="button" id="accountBtn" class="ghost-btn">
          <span class="acc-full">管理员登录</span><span class="acc-short">登录</span>
        </button>
        <button type="button" id="submitBtn" class="action-cta-btn">
          <span class="cta-main" id="submitBtnMain">＋ 投稿<span class="cta-ext">成绩</span></span>
          <span class="cta-sub" id="submitBtnSub" aria-hidden="true">SUBMIT ▽▽</span>
        </button>
      </div>
    </div>

    <nav class="subnav-bar" id="subnavBar" aria-label="榜单视图导航">
      <div class="subnav-inner" id="subnav">
        <div class="subnav-tabs" id="subnavTabs"></div>
        <div class="subnav-right" id="subnavRight">
          <span class="subnav-meta" id="subnavMeta">MANE’S BULLETIN · HIGH SCORE</span>
          <span id="connectionBadge" class="status-pill is-offline-archive" aria-live="polite">
            <span class="status-dot"></span>
            <span id="connectionText">离线档案 · v4.1</span>
          </span>
          <button type="button" id="syncLiveBtn" class="sync-live-btn" data-action="sync-live">同步在线库 ↻</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="shell">
    <div class="uttu-shell-frame">
      <span class="frame-corner tl" aria-hidden="true"></span>
      <span class="frame-corner tr" aria-hidden="true"></span>
      <span class="frame-corner bl" aria-hidden="true"></span>
      <span class="frame-corner br" aria-hidden="true"></span>

      <section class="masthead" id="masthead" aria-live="polite"></section>

      <div id="globalNotice" class="global-notice" role="status" hidden></div>

      <div id="workspace" class="workspace"></div>
    </div>
  </main>

  <footer class="site-footer" id="siteFooter">
    <div class="footer-inner">
      <div class="footer-col">
        <div class="footer-brand">
          <strong>REVERSE: 1999 · 玩家社区榜单</strong>

        </div>
        <p class="footer-credits">
          社区榜单站长：幻化凌风（<a href="https://space.bilibili.com/266889606" target="_blank" rel="noopener noreferrer">哔哩哔哩主页 ↗</a>）·
          管理员：寻屿、莳雨枫椛、偶尔出现的神秘猫猫头、椋-喵
        </p>

      <div class="footer-col footer-links">
        <div class="footer-ref-links">
          <a href="https://res1999.huijiwiki.com/wiki/%E9%AC%83%E6%AF%9B%E9%82%AE%E6%8A%A5" target="_blank" rel="noopener noreferrer">灰机 Wiki · 鬃毛邮报 ↗</a>
          <a href="https://res1999.huijiwiki.com/wiki/%E7%84%A6%E7%82%B9%E9%97%AA%E5%9B%9E" target="_blank" rel="noopener noreferrer">灰机 Wiki · 焦点闪回 ↗</a>
        </div>
        <p class="footer-disclaimer">
          本网站为非官方玩家共建社区项目，与游戏发行方无隶属关系。请勿在成绩截图中暴露个人敏感信息。
        </p>
      </div>
    </div>
  </footer>

  <div id="glossaryPopoverRoot"></div>
  <div id="modalRoot"></div>
  <div id="charPickerRoot"></div>
  <div id="psyPickerRoot"></div>
